; EPUB 簡轉繁 + 匯入 Calibre 流程設定檔(範例)
; 使用方式:複製本檔為 config.ini,把所有 <尖括號> 的部分改成你自己的路徑
; 路徑請用絕對路徑,不要留結尾反斜線

[Paths]
; 【來源資料夾】你平常存放新下載 EPUB 的地方
; 程式執行時會把這裡的 .epub 移到暫存資料夾。處理成功後來源檔會刪除(進資源回收筒)
; 可加多個:SourceFolder2、SourceFolder3 … 依序往下加,遇到不存在的編號就停止讀取
SourceFolder1 = <你的路徑>\Incoming

; 【暫存資料夾】待轉換的書會先集中到這裡,轉換在這裡進行
; 這是程式的工作區,請不要手動放重要檔案進去
StagingFolder = <你的路徑>\Convert_Staging

; 【問題檔案資料夾】轉換造成問題的書會移到這裡
; 程式不會自動處理這裡的檔案,等你自己決定要不要強制轉換
; (來源本身損壞的書則留在暫存資料夾原地不動,方便你直接打開檢查)
ErrorFolder = <你的路徑>\Convert_Error

; 【轉換完成資料夾】轉換成功、等待匯入 Calibre 的書放在這裡
; 匯入 Calibre 成功後,這裡的檔案會刪除(進資源回收筒)
ConvertedFolder = <你的路徑>\Convert_OK

[Calibre]
; 【calibredb 路徑】Calibre 的命令列工具,負責把書匯入書庫(以下是預設安裝位置)
CalibreDbExe = C:\Program Files\Calibre2\calibredb.exe
; 【Calibre 主程式】匯入完成且確實有匯入書時,程式會自動開啟它
CalibreExe = C:\Program Files\Calibre2\calibre.exe
; 【Calibre 書庫資料夾】書最後會匯入這個書庫(裡面有 metadata.db 的那個資料夾)
LibraryPath = <你的路徑>\Calibre Library

[Conversion]
; 【OpenCC 設定】s2twp = 簡體轉台灣正體,並修正慣用詞彙(例如「软件」→「軟體」)
OpenCCConfig = s2twp
; 【日文偵測門檻】假名佔比超過這個值,就當作日文書,整本跳過不轉換(範圍 0.0 ~ 1.0)
KanaDensityThreshold = 0.15
